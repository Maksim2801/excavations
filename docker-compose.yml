services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: archaeology
      POSTGRES_PASSWORD: archaeology
      POSTGRES_DB: archaeology_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archaeology -d archaeology_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://archaeology:archaeology@db:5432/archaeology_db
      TEST_DATABASE_URL: postgresql+psycopg://archaeology:archaeology@db:5432/archaeology_test
      JWT_SECRET: diploma-demo-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 720
      UPLOAD_DIR: /app/uploads
      REPORT_DIR: /app/reports
      FRONTEND_DIR: /frontend
      MAX_UPLOAD_MB: 20
      BASE_URL: http://localhost:8000
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
      - ./frontend:/frontend
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
