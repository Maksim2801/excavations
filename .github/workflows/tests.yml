name: Regression tests
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: archaeology
          POSTGRES_PASSWORD: archaeology
          POSTGRES_DB: archaeology_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U archaeology -d archaeology_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://archaeology:archaeology@localhost:5432/archaeology_test
          REQUIRE_POSTGIS_TESTS: '1'
      - run: node tests/report-state.test.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
